name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The browser host links the native SkiaSharp library, which needs the
      # emscripten toolchain that ships with the wasm-tools workload.
      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Restore
        run: dotnet restore CodePublisher.slnx -p:Configuration=Release

      - name: Build
        run: dotnet build CodePublisher.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet run --project tests/CodePublisher.Tests/CodePublisher.Tests.csproj --configuration Release --no-build -- --disable-logo --progress off

      # Publish is verified because the macOS app-bundle target and the NativeAOT
      # output path are not exercised by `dotnet build`.
      - name: Publish (self-contained, Windows)
        if: runner.os == 'Windows'
        run: >
          dotnet publish src/CodePublisher/CodePublisher.Desktop/CodePublisher.Desktop.csproj
          --configuration Release --no-restore --self-contained true
          -p:PublishTrimmed=false -p:PublishAot=false -p:PublishReadyToRun=false
          -o "${{ runner.temp }}/publish-scd"

      # NativeAOT must not use --no-restore: the ILCompiler package is only added
      # to the assets file by a restore that sees PublishAot, and a stale assets file
      # makes the publish silently fall back to a trimmed self-contained build.
      #
      # PublishTrimmed must not be set to false here: native compilation always trims,
      # and the SDK fails the publish with "PublishTrimmed is implied by native
      # compilation and cannot be disabled." when it is.
      - name: Publish (NativeAOT, Linux/macOS)
        if: runner.os != 'Windows'
        run: >
          dotnet publish src/CodePublisher/CodePublisher.Desktop/CodePublisher.Desktop.csproj
          --configuration Release --self-contained true
          -p:PublishAot=true -p:PublishReadyToRun=false -p:PublishSingleFile=false
          -o "${{ runner.temp }}/publish-aot"

      - name: Verify NativeAOT output
        if: runner.os != 'Windows'
        run: |
          out="${{ runner.temp }}/publish-aot"
          test -f "$out/CodePublisher.Desktop"
          # A NativeAOT publish has no managed entry assembly; a silent fallback to
          # a trimmed self-contained publish would leave it behind.
          test ! -f "$out/CodePublisher.Desktop.dll"

      # The browser host links the native SkiaSharp library, so it fails at
      # startup with "System.DllNotFoundException: libSkiaSharp" when the
      # native assets or the emscripten toolchain are missing. Build it and
      # check the output carries the linked native module.
      - name: Build the browser host
        run: >
          dotnet publish
          src/CodePublisher/CodePublisher.Browser/CodePublisher.Browser.csproj
          --configuration Release --no-restore
          -o "${{ runner.temp }}/publish-browser"

      - name: Verify the browser host links the native SkiaSharp library
        run: |
          out="${{ runner.temp }}/publish-browser/wwwroot/_framework"
          # The emscripten link step folds libSkiaSharp into the native module.
          # Without it the app fails at startup with a DllNotFoundException.
          # sk_FragCoord is a Skia shader symbol that only appears once the
          # Skia native code is linked in.
          test -n "$(ls "$out"/dotnet.native.*.wasm 2>/dev/null)"
          grep -qa 'sk_FragCoord' "$out"/dotnet.native.*.wasm

      - name: Verify macOS bundle executable matches the publish output
        if: runner.os == 'macOS'
        run: |
          out="${{ runner.temp }}/publish-aot"
          published="$out/CodePublisher.Desktop"
          bundled="$out/CodePublisher.app/Contents/MacOS/CodePublisher.Desktop"
          test -f "$published"
          test -f "$bundled"
          # A stale bundle would hold the framework-dependent apphost instead of
          # the NativeAOT binary that sits at the publish root.
          cmp -s "$published" "$bundled"
